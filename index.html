<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="stijl.css?v=7">
<title>Claude leren</title>
</head>
<body>
<nav><div class="nav-in"><a class="logo" href="/"><span class="dot"></span>Promptstad</a><a class="knop actief" href="./">Claude leren</a><a class="knop" href="cheat-sheet/">Cheat sheet</a></div></nav>
<div class="band"><h1><span>Claude leren:</span> kijken en onthouden</h1></div>
<div class="intro"><p>Claude Leren is mijn oefenplek: korte filmpjes en een cheat sheet over werken met Claude Code, gemaakt als geheugensteun voor mezelf. Ik zet het online omdat anderen er misschien ook iets aan hebben.</p></div>
<main><div class="inner"><div class="kaarten" id="lijst"></div></div></main>
<script>
const spiek='<a class="kaart beeld spiek" href="cheat-sheet/"><img src="beeld/spiekbriefje.svg?v=2" alt=""><div class="tekst"><div class="label">Cheat sheet</div><h2>Tien slashcommando\'s</h2><p>Tien handige commando\'s, elk met een eigen oefening. Oefen er elke dag één.</p></div></a>';
const lijst=document.getElementById('lijst');
lijst.innerHTML=spiek;
fetch('filmpjes.json',{cache:'no-store'}).then(r=>r.json()).then(f=>{
  const nr=x=>parseInt((x.titel.match(/Deel (\d+)/)||[0,99])[1]);
  f.sort((a,b)=>nr(a)-nr(b));
  lijst.innerHTML=f.map(x=>{
    const [deel,...rest]=x.titel.split(' · ');
    const n=nr(x), img=n<99?'<div class="plaatje"><img src="beeld/deel'+n+'.svg?v=2" alt=""><span class="play" aria-hidden="true"></span></div>':'';
    return '<a class="kaart beeld" href="'+x.slug+'/">'+img+'<div class="tekst"><div class="label">'+(rest.length?deel:x.datum)+'</div><h2>'+(rest.length?rest.join(' · '):x.titel)+'</h2><p>'+(x.omschrijving||'')+'</p></div></a>';
  }).join('')+spiek;
});
</script>
</body>
</html>
